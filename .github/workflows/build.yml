name: Build & Push Odoo image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['Dockerfile']
  schedule:
    - cron: "0 6 * * 1"

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/surmod/docker-odoo

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          no-cache: true
          tags: ${{ env.IMAGE }}:inspect

      - name: Extract version info
        id: meta
        run: |
          APP_VERSION=$(docker run --rm --entrypoint sh ${{ env.IMAGE }}:inspect -c 'python3 -c "import odoo; print(odoo.release.version)" 2>/dev/null || odoo --version 2>/dev/null | grep -oP "[0-9]+\.[0-9.]+" || echo unknown')
          APP_VERSION=$(echo "$APP_VERSION" | head -1 | tr -d '[:space:]')
          APP_VERSION=${APP_VERSION:-unknown}
          PYTHON_VERSION=$(docker run --rm --entrypoint python3 ${{ env.IMAGE }}:inspect -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}.{sys.version_info.micro}")')
          echo "app=${APP_VERSION}" >> $GITHUB_OUTPUT
          echo "python=${PYTHON_VERSION}" >> $GITHUB_OUTPUT
          echo "Built: Odoo ${APP_VERSION} / Python ${PYTHON_VERSION}"

      - name: Tag and push
        run: |
          docker tag ${{ env.IMAGE }}:inspect ${{ env.IMAGE }}:latest
          docker tag ${{ env.IMAGE }}:inspect ${{ env.IMAGE }}:${{ steps.meta.outputs.app }}
          docker tag ${{ env.IMAGE }}:inspect ${{ env.IMAGE }}:${{ steps.meta.outputs.app }}-python${{ steps.meta.outputs.python }}
          docker push ${{ env.IMAGE }}:latest
          docker push ${{ env.IMAGE }}:${{ steps.meta.outputs.app }}
          docker push ${{ env.IMAGE }}:${{ steps.meta.outputs.app }}-python${{ steps.meta.outputs.python }}
